name: Build PhotoCraft WASM

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit SHA to build (optional, defaults to main)'
        required: false
        default: 'main'
  push:
    paths:
      - '.github/workflows/build-photocraft-wasm.yml'
      - 'apply-bridge.js'

jobs:
  build-wasm:
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout PhotoCraft source
        uses: actions/checkout@v4
        with:
          repository: storytold/photocraft
          ref: ${{ github.event.inputs.commit || 'main' }}
          submodules: recursive
          fetch-depth: 1

      - name: Checkout deploy repo for scripts
        uses: actions/checkout@v4
        with:
          repository: xiaobubuya/xiaobubuya.github.io
          path: deploy-repo
          fetch-depth: 1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Apply AI Bridge modifications
        run: |
          echo "=== Applying AI Bridge modifications ==="
          node deploy-repo/apply-bridge.js
          echo ""
          echo "=== Verifying modifications ==="
          grep -n "execute_command\|has_session\|request_repaint\|COMMAND_QUEUE\|SESSION_READY\|self\.app\.session\.execute" apps/photocraft-web/src/web.rs

      - name: Build WASM with Trunk
        working-directory: apps/photocraft-web
        run: |
          echo "Building PhotoCraft WASM..."
          trunk build --release
          echo ""
          echo "=== Build artifacts ==="
          ls -la ../../dist/web/ 2>/dev/null || ls -la dist/ 2>/dev/null || true

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: photocraft-wasm
          path: |
            dist/web/photocraft_web_bg.wasm
            dist/web/photocraft-web-boot-*.js
            dist/web/photocraft_web_bg.wasm.br
          if-no-files-found: error

      - name: Deploy to GitHub Pages
        run: |
          echo "=== Deploying to xiaobubuya.github.io ==="
          
          git clone https://github.com/xiaobubuya/xiaobubuya.github.io.git ../deploy-repo
          cd ../deploy-repo
          
          mkdir -p photocraft
          
          cp ../dist/web/photocraft_web_bg.wasm photocraft/
          cp ../dist/web/photocraft-web-boot-*.js photocraft/
          cp ../dist/web/photocraft_web_bg.wasm.br photocraft/ 2>/dev/null || true
          
          git add .
          git commit -m "chore: update PhotoCraft WASM with AI Bridge (run #${GITHUB_RUN_NUMBER})"
          git push
          
          echo "=== Artifacts deployed successfully! ==="
