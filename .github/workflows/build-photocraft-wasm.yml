name: Build PhotoCraft WASM

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit SHA to build (optional, defaults to main)'
        required: false
        default: 'main'
  push:
    paths:
      - '.github/workflows/build-photocraft-wasm.yml'
      - 'apply-bridge.js'

jobs:
  build-wasm:
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout PhotoCraft source
        uses: actions/checkout@v4
        with:
          repository: storytold/photocraft
          ref: ${{ github.event.inputs.commit || 'main' }}
          submodules: recursive
          fetch-depth: 1

      - name: Checkout deploy repo for scripts
        uses: actions/checkout@v4
        with:
          repository: xiaobubuya/xiaobubuya.github.io
          path: deploy-repo
          fetch-depth: 1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Apply AI Bridge modifications
        run: |
          echo "=== Applying AI Bridge modifications ==="
          node deploy-repo/apply-bridge.js
          echo ""
          echo "=== Verifying modifications ==="
          grep -n "execute_command\|has_session\|request_repaint\|COMMAND_QUEUE\|SESSION_READY\|self\.app\.session\.execute" apps/photocraft-web/src/web.rs

      - name: Build WASM with Trunk
        working-directory: apps/photocraft-web
        run: |
          echo "Building PhotoCraft WASM..."
          trunk build --release
          echo ""
          echo "=== Build artifacts ==="
          find . -name '*.wasm' -o -name '*.wasm.br' -o -name '*boot*' -o -name '*.js.br' 2>/dev/null
          echo ""
          echo "=== Checking dist/web ==="
          ls -la ../../dist/web/ 2>/dev/null || echo "dist/web not found at ../../"
          ls -la dist/ 2>/dev/null || echo "dist/ not found at apps/photocraft-web/"

      - name: Find output directory
        id: find_output
        run: |
          echo "=== Locating build output ==="
          WASM_DIR=$(find . -path '*/dist/web' -type d | head -1)
          if [ -z "$WASM_DIR" ]; then
            WASM_DIR=$(find . -name '*.wasm' -exec dirname {} \; | head -1)
          fi
          if [ -z "$WASM_DIR" ]; then
            echo "ERROR: Could not find WASM output directory"
            find . -name '*.wasm' -o -name '*.wasm.br' 2>/dev/null
            exit 1
          fi
          echo "WASM_DIR=$WASM_DIR" >> $GITHUB_OUTPUT
          echo "Found output at: $WASM_DIR"
          ls -la "$WASM_DIR"
          echo ""
          echo "=== All output files ==="
          find . -name '*.wasm' -o -name '*.wasm.br' -o -name '*boot*' -o -name '*.js.br' 2>/dev/null

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: photocraft-wasm
          path: |
            ${{ steps.find_output.outputs.WASM_DIR }}/*
          if-no-files-found: error

      - name: Deploy to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Deploying to xiaobubuya.github.io ==="
          
          # Use step output from find_output step
          WASM_DIR="${{ steps.find_output.outputs.WASM_DIR }}"
          WASM_DIR="${WASM_DIR#./}"  # Strip leading ./
          
          if [ -z "$WASM_DIR" ]; then
            echo "ERROR: find_output step did not produce WASM_DIR"
            find . -name '*.wasm' -o -name '*.wasm.br' 2>/dev/null
            exit 1
          fi
          
          echo "WASM output at: $GITHUB_WORKSPACE/$WASM_DIR"
          ls -la "$GITHUB_WORKSPACE/$WASM_DIR/"
          
          # Count files to verify before copying
          JS_COUNT=$(find "$GITHUB_WORKSPACE/$WASM_DIR/" -maxdepth 1 -name '*.js' | wc -l)
          WASM_COUNT=$(find "$GITHUB_WORKSPACE/$WASM_DIR/" -maxdepth 1 -name '*.wasm' | wc -l)
          HTML_COUNT=$(find "$GITHUB_WORKSPACE/$WASM_DIR/" -maxdepth 1 -name '*.html' | wc -l)
          echo "Files found: $JS_COUNT JS, $WASM_COUNT WASM, $HTML_COUNT HTML"
          
          if [ "$JS_COUNT" -eq 0 ] && [ "$WASM_COUNT" -eq 0 ]; then
            echo "ERROR: No JS or WASM files found to deploy"
            find "$GITHUB_WORKSPACE/$WASM_DIR/" -type f
            exit 1
          fi
          
          # Clone with authentication
          git clone https://${GITHUB_ACTOR}:${GITHUB_TOKEN}@github.com/xiaobubuya/xiaobubuya.github.io.git ../deploy-repo
          cd ../deploy-repo
          
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          
          mkdir -p photocraft
          
          # Remove old built files to avoid stale hashed filenames
          rm -f photocraft/index.html
          rm -f photocraft/photocraft-web-boot-*.js
          rm -f photocraft/photocraft-web-boot-*.wasm
          rm -f photocraft/photocraft-web-boot-*.wasm.br
          rm -f photocraft/photocraft-web-*.js
          rm -f photocraft/photocraft-web-*.wasm
          rm -f photocraft/photocraft-web-*.wasm.br
          
          # Copy new build output using find -exec for robustness
          find "$GITHUB_WORKSPACE/$WASM_DIR/" -maxdepth 1 -name '*.js' -exec cp {} photocraft/ \;
          find "$GITHUB_WORKSPACE/$WASM_DIR/" -maxdepth 1 -name '*.wasm' -exec cp {} photocraft/ \;
          find "$GITHUB_WORKSPACE/$WASM_DIR/" -maxdepth 1 -name '*.wasm.br' -exec cp {} photocraft/ \;
          find "$GITHUB_WORKSPACE/$WASM_DIR/" -maxdepth 1 -name '*.html' -exec cp {} photocraft/ \;

          # ── Inject ai-widget.js (post-build) ──
          # Trunk 会静默丢弃引用不到文件的 <script src>：模板里写 ../ai-widget.js
          # （相对模板即 apps/ai-widget.js，不存在），所以构建产物里那个标签不见了。
          # 因此必须在构建之后注入，并且用同目录相对路径。
          # 用 sed 而不是 python heredoc —— heredoc 体若缩进为 0 会终止 YAML 的 run: | block，
          # 整个 workflow 解析失败（run #28 就是那样挂的）。
          cp ai-widget.js photocraft/ai-widget.js || { echo "::error::ai-widget.js 复制失败"; exit 1; }
          if ! grep -q 'src="ai-widget.js"' photocraft/index.html; then
            sed -i 's#</body>#<script src="ai-widget.js"></script>\n</body>#' photocraft/index.html \
              || { echo "::error::ai-widget.js script 标签注入失败"; exit 1; }
          fi
          grep -q 'src="ai-widget.js"' photocraft/index.html || { echo "::error::ai-widget.js 没注入进 index.html"; exit 1; }
          echo "  Copied ai-widget.js + injected <script> tag"

          echo "=== Deployed files ==="
          ls -la photocraft/
          
          # photocraft/ 在 .gitignore 里，普通 git add . 会静默丢掉新产物
          git add -f photocraft/
          
          # 没有变更 = 部署失败，不许静默成功
          if git diff --cached --quiet; then
            echo "::error::nothing staged — 新产物没进 index，检查 .gitignore 是否忽略 photocraft/"
            git status --short --ignored -- photocraft/
            exit 1
          fi
          
          # 上线前硬校验：index.html 引用的每个本地文件都必须已被 git 跟踪
          missing=0
          for f in $(grep -oE "\./[A-Za-z0-9_.-]+\.(js|wasm)" photocraft/index.html | sed 's#^\./##' | sort -u); do
            git ls-files --error-unmatch "photocraft/$f" >/dev/null 2>&1 \
              || { echo "::error::index.html 引用了未提交的文件: $f"; missing=1; }
          done
          [ "$missing" -eq 0 ] || exit 1
          
          git commit -m "chore: update PhotoCraft WASM with AI Bridge (run #${GITHUB_RUN_NUMBER})"
          git push
          
          echo "=== Artifacts deployed successfully! ==="
