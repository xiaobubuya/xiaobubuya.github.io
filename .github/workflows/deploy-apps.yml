name: Deploy Apps (PhotoCraft build → LightCraft auto-deploy)

# 由原 auto-deploy-web.yml 与 build-photocraft-wasm.yml 合并而来。
#
# 为什么合并：
#   原来两个 workflow 共用同一个 `0 */6 * * *` 定时，在同一个分钟各自独立触发，
#   两个都往 main push（build 推 photocraft/，auto-deploy 推 lightcraft/）。
#   1) 没有顺序保证 —— 谁先谁后全看运气；慢的 build(~8min) 和快的 auto-deploy(16s)
#      在同分钟并发 push，build 用 8 分钟前 checkout 的旧 base 再 push 会
#      non-fast-forward 被拒，产物没落盘（历史 run #34/#35 就是这么挂的）。
#   2) pages-build-deployment 按每次 push 触发，顺序不定时最终产物会抖动。
#
# 合并后：一个 workflow 内先 build-wasm job（提交 photocraft），
# 再由 deploy-web-apps job（needs=build-wasm，强制在 build 之后）处理 LightCraft，
# 消除同分支并发 push 的竞态，顺序始终是 先 PhotoCraft 后 LightCraft。
#
# protect-photocraft-wasm.yml 作为独立绊线保留，不部署、只校验。

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      commit:
        description: 'PhotoCraft source commit SHA to build (optional, defaults to upstream main)'
        required: false
        default: 'main'
  push:
    paths:
      - '.github/workflows/deploy-apps.yml'
      - 'apply-bridge.js'

permissions:
  contents: write

concurrency:
  group: deploy-apps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ═════════════════════════════════════════════════════════════════════════
  # Job 1：构建 PhotoCraft WASM（带 AI Bridge），提交 photocraft/
  # 原 build-photocraft-wasm.yml 的 build-wasm job 原样保留（含 snippets 修复）。
  # ═════════════════════════════════════════════════════════════════════════
  build-wasm:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout PhotoCraft source
        uses: actions/checkout@v4
        with:
          repository: storytold/photocraft
          ref: ${{ github.event.inputs.commit || 'main' }}
          submodules: recursive
          fetch-depth: 1

      - name: Checkout deploy repo for scripts
        uses: actions/checkout@v4
        with:
          repository: xiaobubuya/xiaobubuya.github.io
          path: deploy-repo
          fetch-depth: 1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Apply AI Bridge modifications
        run: |
          echo "=== Applying AI Bridge modifications ==="
          node deploy-repo/apply-bridge.js
          echo ""
          echo "=== Verifying modifications ==="
          grep -n "execute_command\|has_session\|request_repaint\|COMMAND_QUEUE\|SESSION_READY\|self\.app\.session\.execute" apps/photocraft-web/src/web.rs

      - name: Build WASM with Trunk
        working-directory: apps/photocraft-web
        run: |
          echo "Building PhotoCraft WASM..."
          trunk build --release
          echo ""
          echo "=== Build artifacts ==="
          find . -name '*.wasm' -o -name '*.wasm.br' -o -name '*boot*' -o -name '*.js.br' 2>/dev/null
          echo ""
          echo "=== Checking dist/web ==="
          ls -la ../../dist/web/ 2>/dev/null || echo "dist/web not found at ../../"
          ls -la dist/ 2>/dev/null || echo "dist/ not found at apps/photocraft-web/"

      - name: Find output directory
        id: find_output
        run: |
          echo "=== Locating build output ==="
          WASM_DIR=$(find . -path '*/dist/web' -type d | head -1)
          if [ -z "$WASM_DIR" ]; then
            WASM_DIR=$(find . -name '*.wasm' -exec dirname {} \; | head -1)
          fi
          if [ -z "$WASM_DIR" ]; then
            echo "ERROR: Could not find WASM output directory"
            find . -name '*.wasm' -o -name '*.wasm.br' 2>/dev/null
            exit 1
          fi
          echo "WASM_DIR=$WASM_DIR" >> $GITHUB_OUTPUT
          echo "Found output at: $WASM_DIR"
          ls -la "$WASM_DIR"

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: photocraft-wasm
          path: |
            ${{ steps.find_output.outputs.WASM_DIR }}/*
          if-no-files-found: error

      # ── 部署到 xiaobubuya.github.io ──
      - name: Deploy PhotoCraft build to repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "=== Deploying to xiaobubuya.github.io ==="

          WASM_DIR="${{ steps.find_output.outputs.WASM_DIR }}"
          WASM_DIR="${WASM_DIR#./}"

          if [ -z "$WASM_DIR" ]; then
            echo "ERROR: find_output step did not produce WASM_DIR"
            find . -name '*.wasm' -o -name '*.wasm.br' 2>/dev/null
            exit 1
          fi

          echo "WASM output at: $GITHUB_WORKSPACE/$WASM_DIR"
          ls -la "$GITHUB_WORKSPACE/$WASM_DIR/"

          # Clone with authentication
          git clone https://x-access-token:${GITHUB_TOKEN}@github.com/xiaobubuya/xiaobubuya.github.io.git ../deploy-repo
          cd ../deploy-repo

          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          # 先同步到最新 main，避免 base 过期导致后面 push 被拒（non-fast-forward）
          git pull --rebase --autostash origin main || {
            echo "::error::pull --rebase 失败，main 已前进；重试自动会用最新 base"
            git fetch origin main && git reset --hard origin/main
          }

          mkdir -p photocraft

          # Remove old built files to avoid stale hashed filenames.
          # snippets/ 每次都会被新构建整体覆盖，先删掉避免旧哈希残留、混放。
          rm -f photocraft/index.html
          rm -f photocraft/photocraft-web-boot-*.js
          rm -f photocraft/photocraft-web-boot-*.wasm
          rm -f photocraft/photocraft-web-boot-*.wasm.br
          rm -f photocraft/photocraft-web-*.js
          rm -f photocraft/photocraft-web-*.wasm
          rm -f photocraft/photocraft-web-*.wasm.br
          rm -rf photocraft/snippets

          # 整体复制整个构建产物目录（含子目录），不再用 `find -maxdepth 1` 只拷顶层文件。
          # 事故根因：Trunk/wasm-bindgen 的产物除了顶层 .js/.wasm 外，还会在 snippets/ 下
          # 生成被 glue JS import 的内联模块（如 snippets/eframe-<hash>/inline0.js）。
          # `find -maxdepth 1` 把这些子目录漏掉 → 线上 404 → index.html 里 glue JS 的
          # `import ... from './snippets/.../inline0.js'` 失败 → 页面卡死在 "Loading PhotoCraft…"。
          # `cp -a "$WASM_DIR"/.` 连隐藏文件与子目录一并复制，子目录依赖不再丢。
          cp -a "$GITHUB_WORKSPACE/$WASM_DIR"/. photocraft/

          # ── Inject ai-widget.js (post-build) ──
          # 用 sed 而不是 python heredoc —— heredoc 体若缩进为 0 会终止 YAML 的 run: | block，
          # 整个 workflow 解析失败（run #28 就是那样挂的）。
          cp ai-widget.js photocraft/ai-widget.js || { echo "::error::ai-widget.js 复制失败"; exit 1; }
          sed -i 's|<script[^>]*src="[^"]*ai-widget\.js"[^>]*>[[:space:]]*<\/script>||g' photocraft/index.html
          sed -i 's#</body>#<script src="ai-widget.js"></script>\n</body>#' photocraft/index.html \
            || { echo "::error::ai-widget.js script 标签注入失败"; exit 1; }
          grep -q 'src="ai-widget.js"' photocraft/index.html || { echo "::error::ai-widget.js 没注入进 index.html"; exit 1; }
          echo "  Copied ai-widget.js + injected <script> tag"

          echo "=== Deployed files ==="
          ls -la photocraft/

          # ── 钉死指纹 ──
          # 先确认新产物里真的有 bridge_symbols，没有就拒绝写锁并 exit 1。
          bash scripts/verify-photocraft-build.sh --update \
            || { echo "::error::产物没有 AI Bridge 符号，拒绝更新指纹"; exit 1; }

          # photocraft/ 在 .gitignore 里，普通 git add . 会静默丢掉新产物
          git add -f photocraft/ photocraft-build.lock

          # 没有变更 = 本次构建产物与 origin/main 逐字节相同，没有东西可发。
          if git diff --cached --quiet; then
            echo "nothing staged — 产物与 origin/main 相同，跳过部署"
            git status --short --ignored -- photocraft/
            echo "=== No changes to deploy (identical artifacts) ==="
            exit 0
          fi

          # 产物确实有变化，才同步 .web-versions.json 的 photocraft 字段并暂存。
          LOCAL_LC=$(sed -n 's/^.*lightcraft=\([^,]*\).*$/\1/p' .web-versions.json 2>/dev/null || true)
          PC_COMMIT=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD 2>/dev/null || echo "main")
          printf 'photocraft=%s,lightcraft=%s\n' "$PC_COMMIT" "${LOCAL_LC:-main}" > .web-versions.json
          echo "  .web-versions.json 已同步: photocraft=$PC_COMMIT"
          git add -f .web-versions.json

          # 上线前硬校验 1：指纹必须自洽
          echo "=== Verifying photocraft-build.lock ==="
          bash scripts/verify-photocraft-build.sh \
            || { echo "::error::photocraft 指纹校验失败"; exit 1; }

          # 上线前硬校验 2：index.html 与 glue JS 引用/import 的每个本地文件都必须真的被复制进
          # photocraft/ 并且已被 git 跟踪，缺一个就拦下（防止再发生 snippets/ 漏拷仍绿线上线）。
          missing=0
          rm -f /tmp/pc_refs.txt
          # (a) index.html 里的相对引用：./<任意路径>.js|.wasm
          grep -oE "[.][/][^\"'<>[:space:]]+[.](js|wasm)" photocraft/index.html \
            | sed -e 's#^[.]/##' -e 's#^[.]/##' \
            | sort -u \
            >> /tmp/pc_refs.txt
          # (b) 各 glue JS 里对 snippets/ 的相对 import（wasm-bindgen 生成，可能不带 ./ 前缀）
          for j in photocraft/photocraft-web-*.js; do
            if [ -f "$j" ]; then
              grep -oE "[.]?/snippets/[^\"'<>[:space:]]+[.](js|wasm)" "$j" \
                | sed -e 's#^[.]/##' -e 's#^[.]##' \
                | sort -u \
                >> /tmp/pc_refs.txt || true
            fi
          done
          for f in $(sed '/^$/d' /tmp/pc_refs.txt | sort -u); do
            if [ ! -f "photocraft/$f" ]; then
              echo "::error::$f 被引用但未复制到 photocraft/（构建产物不完整）"
              missing=1
              continue
            fi
            if ! git ls-files --error-unmatch "photocraft/$f" >/dev/null 2>&1; then
              echo "::error::index.html/glue 引用了未提交的文件: $f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          git commit -m "chore: update PhotoCraft WASM with AI Bridge (run #${GITHUB_RUN_NUMBER})"
          git push
          echo "=== PhotoCraft build deployed ==="

  # ═════════════════════════════════════════════════════════════════════════
  # Job 2：LightCraft 自动部署（needs=build-wasm，强制在 PhotoCraft 之后跑）
  # 原 auto-deploy-web.yml。PhotoCraft 永远不从上游 release 部署（UPDATE_PC=false）。
  # pull --rebase 保证即使上一 job 或别处刚 push 过 main 也不会 non-fast-forward。
  # ═════════════════════════════════════════════════════════════════════════
  deploy-web-apps:
    needs: build-wasm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check upstream versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail

          if [ -f .web-versions.json ]; then
            echo "local=$(cat .web-versions.json)" >> "$GITHUB_OUTPUT"
          else
            echo "local=none" >> "$GITHUB_OUTPUT"
          fi

          lc_api=$(curl -s "https://api.github.com/repos/storytold/lightcraft/releases/latest")
          lc_tag=$(echo "$lc_api" | jq -r '.tag_name // empty')
          if [ -z "$lc_tag" ]; then
            echo "::warning::LightCraft latest release not found"
            lc_tag="none"
          fi
          echo "lc_tag=$lc_tag" >> "$GITHUB_OUTPUT"
          echo "Latest: LightCraft=$lc_tag"

      - name: Decide if update needed
        id: decide
        shell: bash
        run: |
          # 只处理 LightCraft。PhotoCraft 由 build-wasm job 从打过 AI Bridge 的源码构建，
          # 本 job 永不部署（上游包没有 AI Bridge —— 见 auto-deploy-web.yml 原注释）。
          LOCAL_LC=$(grep -o 'lightcraft=[^,]*' .web-versions.json 2>/dev/null | cut -d= -f2 || true)
          LC="${{ steps.versions.outputs.lc_tag }}"
          UPDATE_LC=false
          if [ "$LC" != "none" ] && { [ "$LOCAL_LC" != "$LC" ] || [ ! -f lightcraft/index.html ]; }; then
            UPDATE_LC=true
          fi
          echo "update_lc=$UPDATE_LC" >> "$GITHUB_OUTPUT"
          echo "Will update LightCraft=$UPDATE_LC"

      - name: Download LightCraft web
        if: steps.decide.outputs.update_lc == 'true'
        shell: bash
        run: |
          set -euo pipefail
          LC="${{ steps.versions.outputs.lc_tag }}"
          VER="${LC#v}"
          ZIP="lightcraft-web-${VER}.zip"
          URL="https://github.com/storytold/lightcraft/releases/download/${LC}/${ZIP}"
          echo "Downloading $URL ..."
          curl -L -o "/tmp/$ZIP" "$URL"
          echo "Size: $(du -h "/tmp/$ZIP")"

      - name: Deploy LightCraft web
        if: steps.decide.outputs.update_lc == 'true'
        shell: bash
        run: |
          set -euo pipefail
          LC="${{ steps.versions.outputs.lc_tag }}"
          VER="${LC#v}"
          ZIP="lightcraft-web-${VER}.zip"

          rm -rf lightcraft/
          mkdir -p lightcraft/

          EXTRACT="$(mktemp -d)"
          unzip -q "/tmp/$ZIP" -d "$EXTRACT"
          cp -a "$EXTRACT"/lightcraft-web-*/. lightcraft/
          rm -rf "$EXTRACT"

          test -f lightcraft/index.html || { echo "::error::lightcraft/index.html 缺失，解包失败"; exit 1; }

          # 上游包里没有 <script src="../ai-widget.js"> 标签，必须在部署后注入，
          # 否则解包 = 悬浮球消失（d325301 删掉的 88 行里有它）。
          sed -i 's|<script[^>]*src="[^"]*ai-widget\.js"[^>]*>[[:space:]]*<\/script>||g' lightcraft/index.html
          sed -i 's#</body>#<script src="../ai-widget.js"></script>\n</body>#' lightcraft/index.html \
            || { echo "::error::ai-widget.js script 标签注入失败"; exit 1; }
          grep -q 'src="../ai-widget.js"' lightcraft/index.html \
            || { echo "::error::ai-widget.js 没注入进 lightcraft/index.html"; exit 1; }
          test -f ai-widget.js || { echo "::error::根目录 ai-widget.js 缺失"; exit 1; }
          echo "  Injected <script src=\"../ai-widget.js\"></script>"
          echo "Deployed LightCraft $LC → lightcraft/ ($(find lightcraft -type f | wc -l) files)"

      - name: Verify AI widget present
        if: steps.decide.outputs.update_lc == 'true'
        shell: bash
        run: |
          set -uo pipefail
          bash scripts/verify-photocraft-build.sh

      - name: Commit changes
        if: steps.decide.outputs.update_lc == 'true'
        shell: bash
        run: |
          set -euo pipefail

          LC="${{ steps.versions.outputs.lc_tag }}"

          LOCAL_PC=$(grep -o 'photocraft=[^,]*' .web-versions.json 2>/dev/null | cut -d= -f2 || true)
          echo "photocraft=$LOCAL_PC,lightcraft=$LC" > .web-versions.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f .web-versions.json lightcraft/
          git commit -m "deploy: update web apps (photocraft=$LOCAL_PC lightcraft=$LC)" || true
          # 上一 job 或别处可能刚 push 过 main，rebase 后再 push 避免 non-fast-forward
          git pull --rebase --autostash origin main || true
          git push
          echo "✅ Deployed: LightCraft $LC (PhotoCraft untouched, still $LOCAL_PC)"

      - name: Already up to date
        if: steps.decide.outputs.update_lc == 'false'
        run: echo "✅ Already up to date (lightcraft=${{ steps.versions.outputs.lc_tag }})"
