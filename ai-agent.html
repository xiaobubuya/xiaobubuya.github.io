<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AI 修图 — muyaya.world</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f0f0f;--surface:#1a1a1a;--surface2:#242424;--border:#333;
  --text:#e8e8e8;--text2:#999;--accent:#e0b84a;--accent2:#c9a03a;
  --success:#4ade80;--error:#ef4444;--radius:12px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;height:100vh;height:100dvh}

/* Header */
.header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.header-left{display:flex;align-items:center;gap:10px}
.logo{font-size:18px;font-weight:700;background:linear-gradient(135deg,var(--accent),#f0d060);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.status{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:4px}
.status-dot{width:8px;height:8px;border-radius:50%;background:#666}
.status-dot.connected{background:var(--success);box-shadow:0 0 6px var(--success)}
.status-dot.error{background:var(--error)}

/* Main content */
.main{flex:1;display:flex;overflow:hidden;position:relative}

/* Chat area */
.chat-area{flex:1;display:flex;flex-direction:column;min-width:0}
.messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:85%;padding:10px 14px;border-radius:var(--radius);font-size:14px;line-height:1.5;word-break:break-word}
.msg.user{align-self:flex-end;background:var(--accent);color:#000;border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--surface2);border-bottom-left-radius:4px}
.msg.system{align-self:center;background:transparent;color:var(--text2);font-size:12px;padding:4px 12px}
.msg .typing{display:inline-flex;gap:3px}
.msg .typing span{width:6px;height:6px;border-radius:50%;background:var(--text2);animation:blink 1.4s infinite}
.msg .typing span:nth-child(2){animation-delay:.2s}
.msg .typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}

.msg img{max-width:100%;border-radius:8px;margin-top:6px;cursor:pointer}
.msg .commands{margin-top:8px;padding:8px;background:var(--bg);border-radius:6px;font-size:12px;font-family:monospace;color:var(--accent)}

/* Input area */
.input-area{padding:10px 16px;background:var(--surface);border-top:1px solid var(--border);display:flex;gap:8px;align-items:flex-end;flex-shrink:0}
.input-wrapper{flex:1;display:flex;flex-direction:column;gap:6px}
.input-row{display:flex;gap:8px;align-items:flex-end}
#msgInput{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;color:var(--text);font-size:14px;outline:none;resize:none;max-height:100px;line-height:1.4}
#msgInput:focus{border-color:var(--accent)}
.btn{border:none;border-radius:var(--radius);padding:10px 16px;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:opacity .2s}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-send{background:var(--accent);color:#000;font-weight:600}
.btn-send:hover:not(:disabled){background:var(--accent2)}
.btn-upload{background:var(--surface2);border:1px solid var(--border);color:var(--text)}
.btn-upload:hover{border-color:var(--accent)}
.btn-clear{background:transparent;color:var(--text2);padding:6px 8px}
.btn-clear:hover{color:var(--text)}

/* Preview panel */
.preview{display:none;flex-direction:column;border-left:1px solid var(--border);background:var(--surface);width:45%;position:relative}
.preview-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
.preview-title{font-size:14px;font-weight:600}
.preview-close{background:none;border:none;color:var(--text2);font-size:20px;cursor:pointer;padding:4px}
.preview-body{flex:1;overflow-y:auto;display:flex;align-items:center;justify-content:center;padding:16px;position:relative}
.preview-img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.preview-placeholder{text-align:center;color:var(--text2)}
.preview-placeholder svg{width:64px;height:64px;margin-bottom:12px;opacity:.3}
.preview-info{padding:8px 14px;border-top:1px solid var(--border);font-size:12px;color:var(--text2);flex-shrink:0}

/* Progress bar */
.progress-bar{height:3px;background:var(--surface2);border-radius:2px;overflow:hidden;margin-top:8px}
.progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s}

/* Upload overlay */
.upload-overlay{position:absolute;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(4px)}
.upload-overlay.active{display:flex}
.upload-box{text-align:center;color:var(--text)}
.upload-box svg{width:80px;height:80px;margin-bottom:16px;color:var(--accent)}
.upload-box p{font-size:16px;margin-bottom:8px}
.upload-box .hint{font-size:13px;color:var(--text2)}

/* Drag state */
.chat-area.dragover{outline:3px dashed var(--accent);outline-offset:-10px}

/* Loading spinner */
.spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Tool selector */
.tool-selector{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:2px;gap:2px}
.tool-btn{border:none;background:transparent;color:var(--text2);padding:5px 12px;font-size:12px;border-radius:6px;cursor:pointer;transition:all .2s;font-weight:500}
.tool-btn.active{background:var(--accent);color:#000;font-weight:600}
.tool-btn:hover:not(.active){color:var(--text);background:rgba(255,255,255,.05)}

/* Mobile responsive */
@media(max-width:768px){
  .preview{position:absolute;inset:0;z-index:50;width:100%}
  .preview-close{font-size:24px}
  .messages{padding:12px}
  .msg{max-width:90%}
}

/* Scrollbar */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text2)}
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-left">
    <span class="logo">✨ AI 修图</span>
    <span class="status">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">连接中...</span>
    </span>
  </div>
  <div style="display:flex;align-items:center;gap:8px">
    <div class="tool-selector">
      <button class="tool-btn active" id="toolPhoto" onclick="setTool('photocraft')">🎨 调色</button>
      <button class="tool-btn" id="toolLight" onclick="setTool('lightcraft')">🖼️ 修图</button>
    </div>
    <button class="btn btn-clear" onclick="clearChat()" title="清空对话">🗑️</button>
  </div>
</div>

<!-- Main -->
<div class="main" id="mainArea">
  <!-- Chat -->
  <div class="chat-area" id="chatArea">
    <div class="messages" id="messages">
      <div class="msg system">上传图片，用自然语言描述你想要的效果。<br>🎨 <b>调色</b> = PhotoCraft（色温/饱和度/滤镜）　🖼️ <b>修图</b> = LightCraft（磨皮/去雾/光影）</div>
    </div>
    <div class="input-area">
      <input type="file" id="fileInput" accept="image/*" style="display:none">
      <div class="input-wrapper">
        <input type="text" id="msgInput" placeholder="输入修图指令，如：调亮一点，加暖色调..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}" disabled>
        <div style="display:flex;gap:6px;align-items:center">
          <button class="btn btn-upload" onclick="document.getElementById('fileInput').click()" title="上传图片">📷</button>
          <span style="font-size:11px;color:var(--text2);flex:1" id="uploadHint">未上传图片</span>
        </div>
      </div>
      <button class="btn btn-send" id="sendBtn" onclick="send()" disabled>发送</button>
    </div>
  </div>

  <!-- Preview -->
  <div class="preview" id="preview">
    <div class="preview-header">
      <span class="preview-title" id="previewTitle">预览</span>
      <button class="preview-close" onclick="closePreview()">✕</button>
    </div>
    <div class="preview-body" id="previewBody">
      <div class="preview-placeholder" id="previewPlaceholder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
        <p>等待处理结果...</p>
      </div>
    </div>
    <div class="preview-info" id="previewInfo"></div>
  </div>

  <!-- Upload overlay -->
  <div class="upload-overlay" id="uploadOverlay">
    <div class="upload-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      <p>正在上传图片...</p>
      <div class="spinner" style="margin:12px auto"></div>
      <div class="hint" id="uploadHint2"></div>
    </div>
  </div>
</div>

<script>
// Use relative URLs when served from same origin (server nginx proxy)
// Fall back to direct server URL when on GitHub Pages
const IS_SAME_ORIGIN = window.location.protocol === 'http:' || 
  (window.location.hostname === 'muyaya.world' && window.location.port === '');
const API_BASE = IS_SAME_ORIGIN ? '' : 'http://120.48.86.101:3000';
const WS_URL = IS_SAME_ORIGIN 
  ? (window.location.protocol === 'https:' ? 'wss:' : 'ws:') + '//' + window.location.host + '/ws?key=bubu'
  : 'ws://120.48.86.101:3000/ws?key=bubu';
const API_KEY = 'bubu';

let ws = null;
let currentImage = null;
let currentTaskId = null;
let isProcessing = false;
let currentTool = 'photocraft';

// ── Tool selector ──────────────────────────────────────────────────
function setTool(tool) {
  currentTool = tool;
  document.getElementById('toolPhoto').classList.toggle('active', tool === 'photocraft');
  document.getElementById('toolLight').classList.toggle('active', tool === 'lightcraft');
  const input = document.getElementById('msgInput');
  if (tool === 'lightcraft') {
    input.placeholder = '输入修图指令，如：磨皮、提亮、去雾...';
  } else {
    input.placeholder = '输入调色指令，如：调亮一点，加暖色调...';
  }
}

// ── Status ─────────────────────────────────────────────────────────
function setStatus(state, text) {
  const dot = document.getElementById('statusDot');
  dot.className = 'status-dot' + (state === 'connected' ? ' connected' : state === 'error' ? ' error' : '');
  document.getElementById('statusText').textContent = text;
}

// ── WebSocket ──────────────────────────────────────────────────────
function connectWS() {
  setStatus('connecting', '连接中...');
  ws = new WebSocket(WS_URL);
  ws.onopen = () => {
    setStatus('connected', '已连接');
    document.getElementById('msgInput').disabled = false;
    document.getElementById('sendBtn').disabled = false;
    console.log('WS connected');
  };
  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      handleWSMessage(msg);
    } catch { console.error('WS parse error:', e.data); }
  };
  ws.onclose = () => {
    setStatus('error', '已断开');
    document.getElementById('msgInput').disabled = true;
    document.getElementById('sendBtn').disabled = true;
    setTimeout(connectWS, 3000);
  };
  ws.onerror = () => setStatus('error', '连接错误');
}

function handleWSMessage(msg) {
  switch (msg.type) {
    case 'ack':
      currentTaskId = msg.taskId;
      addMsg('system', `任务已接收: ${msg.taskId}`);
      break;
    case 'thinking':
      addTyping(msg.thought);
      break;
    case 'command':
      addTyping('');
      addMsg('bot', `🎯 解析到指令:\n${(msg.params || []).map(c => `\`${c.cmd}(${JSON.stringify(c.params)})\``).join('\n')}\n${msg.explanation ? '— ' + msg.explanation : ''}`);
      break;
    case 'progress':
      addTyping('');
      addMsg('bot', `📊 ${msg.message} (${msg.step}/${msg.total})`);
      break;
    case 'log':
      addMsg('system', `[log] ${msg.message}`);
      break;
    case 'done':
      addTyping('');
      addMsg('bot', `✅ 完成！结果: <a href="${msg.resultUrl}" target="_blank">${msg.resultUrl}</a>`);
      if (msg.resultUrl) showResult(msg.resultUrl, msg.commands || []);
      isProcessing = false;
      document.getElementById('sendBtn').disabled = false;
      break;
    case 'error':
      addTyping('');
      addMsg('bot', `❌ 错误: ${msg.message} [${msg.code}]`);
      isProcessing = false;
      document.getElementById('sendBtn').disabled = false;
      break;
  }
}

// ── Messages ───────────────────────────────────────────────────────
function addMsg(role, html) {
  const el = document.createElement('div');
  el.className = `msg ${role}`;
  el.innerHTML = html;
  document.getElementById('messages').appendChild(el);
  scrollToBottom();
}

function addTyping(text) {
  addMsg('bot', `<div class="typing"><span></span><span></span><span></span></div>${text ? '<br>' + text : ''}`);
}

function scrollToBottom() {
  const el = document.getElementById('messages');
  el.scrollTop = el.scrollHeight;
}

// ── Upload ─────────────────────────────────────────────────────────
document.getElementById('fileInput').addEventListener('change', uploadImage);

// Drag & drop
const chatArea = document.getElementById('chatArea');
chatArea.addEventListener('dragover', (e) => { e.preventDefault(); chatArea.classList.add('dragover'); });
chatArea.addEventListener('dragleave', () => chatArea.classList.remove('dragover'));
chatArea.addEventListener('drop', async (e) => {
  e.preventDefault();
  chatArea.classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) {
    await uploadFile(file);
  }
});

async function uploadImage(e) {
  const file = e.target.files[0];
  if (file) await uploadFile(file);
  e.target.value = '';
}

async function uploadFile(file) {
  const overlay = document.getElementById('uploadOverlay');
  const hint = document.getElementById('uploadHint2');
  overlay.classList.add('active');
  hint.textContent = `${file.name} (${(file.size/1024).toFixed(1)}KB)`;

  try {
    const form = new FormData();
    form.append('image', file);

    const res = await fetch(`${API_BASE}/api/upload`, {
      method: 'POST',
      headers: { 'X-API-Key': API_KEY },
      body: form,
    });
    const data = await res.json();

    if (data.filename || data.imageId) {
      currentImage = { filename: data.filename, imageId: data.imageId };
      addMsg('system', `📷 已上传: ${data.filename}`);
      document.getElementById('uploadHint').textContent = `📷 ${data.filename}`;
      document.getElementById('msgInput').placeholder = '输入修图指令，如：调亮一点，加暖色调...';
      addMsg('system', '输入指令开始修图，如："调亮一点，加暖色调"');
    } else {
      addMsg('system', `⚠️ 上传响应: ${JSON.stringify(data)}`);
    }
  } catch (err) {
    addMsg('system', `❌ 上传失败: ${err.message}`);
  }
  overlay.classList.remove('active');
}

// ── Send ───────────────────────────────────────────────────────────
async function send() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;

  if (!currentImage) {
    addMsg('system', '⚠️ 请先上传一张图片');
    return;
  }

  input.value = '';
  isProcessing = true;
  document.getElementById('sendBtn').disabled = true;
  addMsg('user', text);

  ws.send(JSON.stringify({
    type: 'chat',
    message: text,
    imageId: currentImage.imageId,
    imageFilename: currentImage.filename,
    tool: currentTool,
  }));

  // Also try HTTP fallback
  try {
    const res = await fetch(`${API_BASE}/api/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-API-Key': API_KEY },
      body: JSON.stringify({ message: text, imageId: currentImage.imageId, imageFilename: currentImage.filename, tool: currentTool }),
    });
    const data = await res.json();
    if (data.taskId) {
      currentTaskId = data.taskId;
      addMsg('system', `📨 任务已提交: ${data.taskId}`);
    }
  } catch (err) {
    console.error('HTTP chat failed:', err);
  }
}

// ── Preview ────────────────────────────────────────────────────────
function showResult(url, commands) {
  const preview = document.getElementById('preview');
  const body = document.getElementById('previewBody');
  const placeholder = document.getElementById('previewPlaceholder');
  const title = document.getElementById('previewTitle');
  const info = document.getElementById('previewInfo');

  // Build full URL
  let fullUrl = url;
  if (url.startsWith('/')) fullUrl = API_BASE + url;

  placeholder.style.display = 'none';
  let img = body.querySelector('img');
  if (!img) {
    img = document.createElement('img');
    img.className = 'preview-img';
    body.appendChild(img);
  }
  img.src = fullUrl;
  img.onload = () => {
    info.textContent = `📐 ${img.naturalWidth}×${img.naturalHeight}`;
    if (commands && commands.length) {
      info.textContent += ` | 🎯 ${commands.join(', ')}`;
    }
  };

  preview.style.display = 'flex';
  title.textContent = '处理结果';
}

function closePreview() {
  document.getElementById('preview').style.display = 'none';
}

// ── Clear ──────────────────────────────────────────────────────────
function clearChat() {
  document.getElementById('messages').innerHTML = '<div class="msg system">上传图片，用自然语言描述你想要的效果</div>';
  currentImage = null;
  currentTaskId = null;
  isProcessing = false;
  document.getElementById('uploadHint').textContent = '未上传图片';
  document.getElementById('msgInput').placeholder = '请先上传图片';
  document.getElementById('preview').style.display = 'none';
  scrollToBottom();
}

// ── Init ───────────────────────────────────────────────────────────
document.getElementById('msgInput').placeholder = '请先上传图片';
connectWS();
</script>
</body>
</html>
