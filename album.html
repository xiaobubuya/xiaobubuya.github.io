<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#faf7f4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="我们的相册">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="album.css">
<title>相册 · 我们的婚纱照</title>
</head>
<body class="album-page">

<div id="boot" class="boot">
  <div class="spinner"></div>
</div>

<!-- ============================ 相册列表 ============================ -->
<div id="listView" class="view" hidden>
  <header class="topbar">
    <div class="tb-main">
      <h1><span class="dot"></span>我们的相册</h1>
      <div class="meta" id="listMeta">加载中…</div>
    </div>
    <a class="icon-btn" href="/" aria-label="回到照片">🖼</a>
  </header>

  <main id="albumGrid" class="album-grid"></main>

  <div id="listEmpty" class="empty" hidden>
    <img class="empty-art" src="icon.svg" alt="" aria-hidden="true" width="72" height="72">
    <p>还没有相册</p>
    <p class="dim">点右下角 ＋ 新建一个，把照片排成故事</p>
  </div>

  <button id="btnNewAlbum" class="fab" aria-label="新建相册">＋</button>
</div>

<!-- ============================ 编辑器 ============================ -->
<div id="editView" class="view edit-view" hidden>
  <!-- 顶栏：只留最常用的，永远不滚动 -->
  <div class="edit-bar">
    <button id="btnBack" class="icon-btn" aria-label="返回">‹</button>
    <input id="albumTitle" class="title-input" maxlength="60" placeholder="相册名">
    <span id="saveState" class="save-state"></span>
    <button id="btnToggleTools" class="icon-btn tools-toggle"
            aria-label="工具面板" aria-expanded="false">▾</button>
  </div>

  <!-- 可下拉的工具面板：分组换行排列，不做横向滚动 -->
  <div id="toolPanel" class="tool-panel" hidden>
    <div class="tool-group">
      <span class="tool-label">历史</span>
      <button id="btnUndo" class="icon-btn" title="撤销">↶</button>
      <button id="btnRedo" class="icon-btn" title="重做">↷</button>
    </div>

    <div class="tool-group">
      <span class="tool-label">页面</span>
      <button id="btnPrevPage" class="icon-btn" title="上一页">‹</button>
      <span id="btnPage" class="page-ind">1/1</span>
      <button id="btnNextPage" class="icon-btn" title="下一页">›</button>
      <button id="btnAddPage" class="icon-btn wide" title="加一页">＋页</button>
      <button id="btnDelPage" class="icon-btn wide" title="删除本页">删页</button>
    </div>

    <div class="tool-group">
      <span class="tool-label">画布</span>
      <button id="btnRatio" class="icon-btn wide" title="切换画布比例">3:2</button>
      <button id="btnZoomOut" class="icon-btn" title="缩小">−</button>
      <button id="btnZoom" class="icon-btn wide" title="点一下恢复适应屏幕">100%</button>
      <button id="btnZoomIn" class="icon-btn" title="放大">＋</button>
      <button id="btnRotate" class="icon-btn" title="横屏编辑">⟳</button>
    </div>

    <div class="tool-group">
      <span class="tool-label">排版</span>
      <button id="btnAutoLayout" class="icon-btn wide"
              title="自动排版（连点可换下一个版式）">▤ 自动排版</button>
    </div>

    <div class="tool-group">
      <span class="tool-label">图层</span>
      <button id="btnFront" class="icon-btn" title="置顶">⤒</button>
      <button id="btnUp" class="icon-btn" title="上移">↑</button>
      <button id="btnDown" class="icon-btn" title="下移">↓</button>
      <button id="btnBack2" class="icon-btn" title="置底">⤓</button>
    </div>

    <div class="tool-group">
      <span class="tool-label">元素</span>
      <button id="btnNextItem" class="icon-btn" title="依次选中元素">⇄</button>
      <button id="btnSetCover" class="icon-btn" title="设为封面">☆</button>
      <button id="btnDelItem" class="icon-btn" title="删除选中元素">✕</button>
    </div>

    <div class="tool-group">
      <span class="tool-label">预览</span>
      <button id="btnRead" class="icon-btn wide" title="翻页预览">▶ 翻页</button>
      <button id="btnShare" class="icon-btn wide" title="分享这本相册（只读）">⇪ 分享</button>
    </div>
  </div>

  <div id="stage" class="stage">
    <div id="canvas" class="canvas">
      <div id="itemLayer" class="item-layer"></div>
      <div id="guides" class="guides"><i class="v"></i><i class="h"></i></div>
    </div>
    <div id="rotateTip" class="rotate-tip">
      <span><b>横屏编辑更顺手</b> —— 画布是横向的，竖屏下可操作区域偏窄。</span>
      <button id="btnRotateFromTip" class="mini-btn primary-mini">切横屏</button>
      <button id="tipClose" class="mini-btn">知道了</button>
    </div>
  </div>

  <div id="tray" class="tray">
    <button id="btnAddPhoto" class="tray-add">＋<br>加照片</button>
    <div id="trayScroll" class="tray-scroll"></div>
  </div>
</div>

<!-- ============================ 阅读器（内部结构由 reader.js 生成）============================ -->
<div id="readView" class="view read-view" hidden></div>

<!-- ============================ 选照片 ============================ -->
<div id="picker" class="sheet" hidden>
  <div class="sheet-mask" data-close></div>
  <div class="sheet-body tall">
    <div class="sheet-head">
      <span id="pickerTitle">选择照片</span>
      <button class="mini-btn" data-close>关闭</button>
    </div>
    <div id="pickerGrid" class="picker-grid"></div>
    <div id="pickerLoading" class="loading"><div class="spinner"></div><span>加载中…</span></div>
  </div>
</div>

<!-- ============================ 新建相册 ============================ -->
<div id="newSheet" class="sheet" hidden>
  <div class="sheet-mask" data-close></div>
  <div class="sheet-body">
    <div class="sheet-head"><span>新建相册</span></div>
    <label class="field">
      <span>相册名</span>
      <input id="newTitle" maxlength="60" placeholder="例如：我们的婚礼">
    </label>
    <label class="field">
      <span>画布比例</span>
      <div class="seg" id="newRatio">
        <button type="button" data-r="1.5" class="on">横版 3:2</button>
        <button type="button" data-r="1">方版 1:1</button>
        <button type="button" data-r="0.6667">竖版 2:3</button>
      </div>
    </label>
    <button id="btnCreate" class="primary">创建</button>
    <button class="sheet-item" data-close>取消</button>
  </div>
</div>

<!-- ============================ 冲突提示 ============================ -->
<div id="conflict" class="sheet" hidden>
  <div class="sheet-mask"></div>
  <div class="sheet-body">
    <div class="sheet-head"><span>这一页在别处被改过了</span></div>
    <p class="sheet-note" id="conflictNote"></p>
    <button id="btnOverwrite" class="primary">用我的版本覆盖</button>
    <button id="btnUseServer" class="sheet-item">放弃我的改动，加载对方的版本</button>
    <button class="sheet-item" id="btnConflictLater">先不管，继续编辑</button>
  </div>
</div>

<!-- ============================ 分享 ============================ -->
<div id="shareSheet" class="sheet" hidden>
  <div class="sheet-mask" data-close></div>
  <div class="sheet-body">
    <div class="sheet-head"><span>分享这本相册</span></div>

    <div id="shareOff">
      <p class="sheet-note">
        生成一个<b>永久有效</b>的链接。拿到链接的人<b>只能看、不能改</b>，
        也不需要登录 —— 就像把一本印好的相册递出去。
      </p>
      <button id="btnMakeShare" class="primary">生成分享链接</button>
    </div>

    <div id="shareOn" hidden>
      <p class="sheet-note">任何拿到这个链接的人都能翻看这本相册（只读，不用登录）。</p>
      <div class="share-url">
        <input id="shareUrl" readonly spellcheck="false">
        <button id="btnCopyShare" class="mini-btn">复制</button>
      </div>
      <p class="sheet-note dim">
        相册内容改了，分享出去的效果会立刻跟着变 ——
        链接不过期，但内容不是冻结的快照。
      </p>
      <button id="btnRevokeShare" class="sheet-item danger">撤销分享（链接立即失效）</button>
    </div>

    <button class="sheet-item" data-close>关闭</button>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="common.js"></script>
<script src="autolayout.js"></script>
<script src="orient.js"></script>
<script src="reader.js"></script>
<script src="album.js"></script>
</body>
</html>
