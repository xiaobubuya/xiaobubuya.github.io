<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- ================================================================
       我们的婚纱照 —— App 图标（矢量版）

       ⚠️ 这个 SVG 必须和 icon-180/192/512.png **是同一套视觉**。
       原来这里是一个圆环占位图，和 PNG 完全不像 —— 于是
       「加到主屏用 PNG、浏览器标签用 SVG」会看到两个不同的图标。

       图形语言和 PNG 一致：两张叠放的相框 + 负空间里的小心心。
       ⚠️ maskable 用途下四周会被裁，所以主体收在中间 ~60% 区域。
       ================================================================ -->
  <rect width="192" height="192" rx="42" fill="#faf7f4"/>

  <!-- 后面那张相框（微微左倾） -->
  <g transform="rotate(-8 96 96)">
    <rect x="52" y="46" width="74" height="88" rx="4"
          fill="#faf7f4" stroke="#2a2320" stroke-width="4.5"/>
  </g>

  <!-- 前面那张相框（微微右倾，盖住后面那张） -->
  <g transform="rotate(6 96 96)">
    <rect x="70" y="54" width="72" height="86" rx="4"
          fill="#faf7f4" stroke="#2a2320" stroke-width="4.5"/>
    <!-- 相框里的心（rose-gold），也是整个图标的视觉焦点 -->
    <path d="M106 92c-6-7.5-16-6-16 3 0 7 9 13 16 18 7-5 16-11 16-18 0-9-10-10.5-16-3z"
          fill="none" stroke="#b98a6a" stroke-width="4" stroke-linejoin="round"/>
  </g>
</svg>
