<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#faf7f4">
<meta name="robots" content="noindex">
<title>我们的婚纱照</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:#faf7f4;color:#2b2320;
    display:grid;place-items:center;
    padding:32px;
    text-align:center;
  }
  .wrap{max-width:320px}
  .ring{
    width:44px;height:44px;margin:0 auto 22px;
    border:1.5px solid #b08d6a;border-radius:50%;
    position:relative;
  }
  .ring::after{
    content:"";position:absolute;inset:7px;
    border:1.5px solid rgba(176,141,106,.45);border-radius:50%;
  }
  h1{font-size:19px;font-weight:600;letter-spacing:.03em}
  p{margin-top:10px;font-size:13.5px;line-height:1.75;color:#7d726a}
  .hint{
    margin-top:26px;padding-top:18px;
    border-top:1px solid rgba(43,35,32,.08);
    font-size:11.5px;color:#b3a89f;line-height:1.7;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="ring"></div>
    <h1>我们的婚纱照</h1>
    <p>相册正在建设中</p>
    <div class="hint">这是临时占位页，相册上线后会被替换</div>
  </div>
</body>
</html>
