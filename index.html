<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#faf7f4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="我们的婚纱照">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
<title>我们的婚纱照</title>

<!-- ================================================================
     分享预览（发到微信/群里时的卡片）
     ----------------------------------------------------------------
     ⚠️ 这里只能放**通用**的兜底图：首页没有"某本相册"的上下文。
     每本相册**自己的** og 标签由 Worker 在 /s/<token> 上服务端渲染
     （见 album-api/src/share-page.js）—— 微信爬虫不执行 JS，
     所以标签必须在服务端就写好。

     ⚠️ og:image 必须是**绝对 URL**，微信不认相对路径。
     ================================================================ -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="我们的婚纱照">
<meta property="og:title" content="我们的婚纱照">
<meta property="og:description" content="只属于我们俩的相册">
<meta property="og:image" content="https://muyaya.world/og-cover.png">
<meta property="og:url" content="https://muyaya.world/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="我们的婚纱照">
<meta name="twitter:description" content="只属于我们俩的相册">
<meta name="twitter:image" content="https://muyaya.world/og-cover.png">
</head>
<body>

<!-- ============================ 登录 ============================ -->
<div id="login" class="login">
  <form id="loginForm" class="login-card" autocomplete="on">
    <!-- 品牌位用真正的 App 图标（原来是 CSS 画的同心圆环占位）。
         ⚠️ 尺寸 46px 是刻意对齐旧 .ring 的占位尺寸，不改变布局。 -->
    <img class="brand-mark" src="icon.svg" alt="" width="46" height="46">
    <h1>我们的婚纱照</h1>
    <p class="sub">只有我们俩能进</p>

    <label class="field">
      <span>你是谁</span>
      <div class="seg" id="userSeg">
        <button type="button" data-user="yuge" class="on">我</button>
        <button type="button" data-user="meimei">老婆</button>
      </div>
    </label>

    <label class="field">
      <span>口令</span>
      <input id="pass" type="password" inputmode="text" autocomplete="current-password"
             placeholder="请输入口令" required>
    </label>

    <button id="loginBtn" type="submit" class="primary">进入</button>
    <div id="loginError" class="err" role="alert"></div>
  </form>
</div>

<!-- ============================ 主界面 ============================ -->
<div id="app" class="app" hidden>
  <header class="topbar">
    <div class="tb-main">
      <h1><span class="dot"></span>我们的婚纱照</h1>
      <div class="meta" id="meta">加载中…</div>
    </div>
    <button id="btnUpload" class="icon-btn" aria-label="上传照片">＋</button>
    <button id="btnMenu" class="icon-btn" aria-label="更多">⋯</button>
  </header>

  <main id="timeline" class="timeline"></main>

  <div id="loading" class="loading" hidden>
    <div class="spinner"></div><span>加载中…</span>
  </div>
  <div id="empty" class="empty" hidden>
    <!-- 空状态用图标的浅色版做插图：比纯文字有"这是一个相册应用"的暗示，
         又不会抢眼。⚠️ 它是装饰，所以 aria-hidden + 空 alt。 -->
    <img class="empty-art" src="icon.svg" alt="" aria-hidden="true" width="72" height="72">
    <p>还没有照片</p>
    <p class="dim">等上传功能做好，这里就会热闹起来</p>
  </div>
  <div id="sentinel" class="sentinel"></div>

  <button id="btnTop" class="fab" hidden aria-label="回到顶部">↑</button>

  <!-- 菜单 -->
  <div id="menu" class="sheet" hidden>
    <div class="sheet-mask" data-close></div>
    <div class="sheet-body">
      <div class="sheet-title">设置</div>
      <a class="sheet-item" href="album.html">▦　我们的相册</a>
      <a class="sheet-item" href="studio.html">✦　修图</a>
      <button id="btnSlideshow" class="sheet-item">▶︎　幻灯片播放</button>
      <button id="btnReload" class="sheet-item">↻　重新加载</button>
      <button id="btnLogout" class="sheet-item danger">⎋　退出登录</button>
      <button class="sheet-item" data-close>取消</button>
      <div class="sheet-foot" id="sheetFoot"></div>
    </div>
  </div>
</div>

<!-- ============================ 大图 ============================ -->
<div id="viewer" class="viewer" hidden>
  <div class="viewer-stage" id="viewerStage">
    <img id="viewerImg" alt="">
    <div class="viewer-spinner" id="viewerSpinner"><div class="spinner"></div></div>
  </div>
  <div class="viewer-bar">
    <span id="viewerPos" class="pos"></span>
    <span id="viewerTime" class="dim"></span>
    <button id="viewerClose" class="icon-btn light" aria-label="关闭">✕</button>
  </div>
  <button class="viewer-nav prev" id="viewerPrev" aria-label="上一张">‹</button>
  <button class="viewer-nav next" id="viewerNext" aria-label="下一张">›</button>
</div>

<!-- ============================ 幻灯片 ============================ -->
<div id="show" class="show" hidden>
  <img id="showImg" alt="">
  <div class="show-bar" id="showBar">
    <button id="showToggle" class="icon-btn light">❚❚</button>
    <span id="showPos" class="pos"></span>
    <button id="showExit" class="icon-btn light">✕</button>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<!-- ============================ 上传 ============================ -->
<input id="fileInput" type="file" accept="image/*" multiple hidden>

<div id="uploadPanel" class="upload-panel" hidden>
  <div class="up-head">
    <span class="up-title" id="upTitle">准备中…</span>
    <span class="up-count" id="upCount"></span>
    <button id="upClose" class="icon-btn" aria-label="关闭">✕</button>
  </div>
  <div class="up-bar"><i id="upFill"></i></div>
  <div class="up-list" id="upList"></div>
</div>

<script src="upload.js"></script>
<script src="app.js"></script>
</body>
</html>
