js_file=photocraft-web-5c0c7d8304dda26a.js
js_sha256=d4de8e7b9da03976af7cfcd9afc0d8f312f78bfcd98007b8152daff7e95980db
widget_sha256=3bafb786b4aca667d45e41560f2a354aa1aaedbe45f1b79c8c20cd7d970c9ea2
