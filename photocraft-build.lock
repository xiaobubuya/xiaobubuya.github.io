# photocraft/ 的构建指纹 —— 锁住带 AI Bridge 的自建构建。
#
# 这是 photocraft/ 的唯一真相来源。scripts/verify-photocraft-build.sh 逐项比对，
# 任何一项对不上就失败，CI 变红。
#
# 为什么需要它：上游 release 包（storytold/photocraft）里没有 AI Bridge。
# 拿上游包覆盖 photocraft/ 会删掉 ai-widget.js 和 index.html 里的 shim，
# 悬浮球就成了点了没反应的死按钮。2026-10-25 的 d325301 就是这么坏的。
#
# 只有 build-photocraft-wasm.yml 在成功构建、且通过下面的 bridge_symbols 校验之后，
# 才可以跑 `scripts/verify-photocraft-build.sh --update` 改这里。
# 手改 = 把校验变成摆设。
# 上游 v0.16.0 的 wasm 只有 98,880 字节；自建构建 26,445,909 字节。
# 低于这个下限就说明被上游包覆盖了。
wasm_file=photocraft-web-88d8ad165fdcf182_bg.wasm
wasm_sha256=9f03e0036f239c5cc1ee78c3ebd9d40ce0c9fca684647e82ea683c348d9328ed
js_file=photocraft-web-a7e6e0ab9e293c82.js
js_sha256=47eb4e22c7a4ce38d044dfb55782ce23b113135ea319bb3824362952f1113cc2
widget_sha256=85b3af089cd1a78fc3124174adf626753a5b6e76ae2df10e439c5a2dbd584ecf
bridge_symbols=execute_command has_session request_repaint
min_wasm_bytes=1048576
