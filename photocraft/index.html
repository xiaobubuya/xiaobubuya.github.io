  <title>PhotoCraft</title>
  
<script type="module">
import init, * as bindings from './photocraft-web-e693319804da66c3.js';
const wasm = await init({ module_or_path: './photocraft-web-3074dac37f862afe_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>

<script type="module">
// AI Bridge API shim: expose Trunk wasm-bindgen exports on window.
// The Trunk-generated script uses await init(), so wasmBindings is set
// asynchronously. Listen for TrunkApplicationStarted to guarantee order.
window.addEventListener('TrunkApplicationStarted', () => {
    const b = window.wasmBindings;
    if (b && typeof b.execute_command === 'function') window.execute_command = b.execute_command;
    if (b && typeof b.has_session === 'function') window.has_session = b.has_session;
    if (b && typeof b.request_repaint === 'function') window.request_repaint = b.request_repaint;
    // window.photocraft.hasImage() — ai-widget.js uses this to detect the editor.
    // Use has_session() (bridge API) instead of the old canvas.toDataURL() hack.
    window.photocraft = {
        hasImage: () => { try { return b.has_session ? b.has_session() : false; } catch(e) { return false; } },
        apiVersion: 'bridge'
    };
});
</script>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #262626; }
    #photocraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #photocraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 0 16px; text-align: center; color: #b8b8b8; font: 14px system-ui, sans-serif; pointer-events: none; }
    #photocraft_loading p { margin: 0 0 8px; max-width: 420px; line-height: 1.5; }
    #photocraft_loading a { color: #e0e0e0; pointer-events: auto; }
    /* The app removes this element once it runs. If the WebAssembly never downloads or doesn't match
       this page, no Rust runs to say so, so the page itself shows what to do after a while. */
    #photocraft_stalled { color: #8c8c8c; visibility: hidden; animation: photocraft-stalled 0s 20s forwards; }
    @keyframes photocraft-stalled { to { visibility: visible; } }
  </style>
