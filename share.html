<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#15110f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="相册">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="album.css">
<!-- 全局导航。分享页用 brand 模式（只有品牌位，没有三个 tab）——
     亲友点开一本相册，给他们"照片/相册/修图"没有意义（会被弹回登录）。 -->
<link rel="stylesheet" href="nav.css">
<title>相册</title>

<!-- ================================================================
     分享预览（兜底）
     ----------------------------------------------------------------
     ⚠️ 这里是**老格式**分享链接（share.html?t=<token>）的页面。
     它是静态文件，拿不到"这本相册的封面"，所以只能用通用图。

     每本相册**自己的**预览图由 Worker 在 /s/<token> 上服务端渲染
     （见 album-api/src/share-page.js）。新链接走那个格式；
     这个页面保留是为了**老链接不失效**。

     ⚠️ 微信爬虫不执行 JS，所以标签必须写在 HTML 里，
     不能在 share.js 里用 JS 设置。
     ================================================================ -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="我们的婚纱照">
<meta property="og:title" content="相册">
<meta property="og:description" content="左右滑动翻页">
<meta property="og:image" content="https://muyaya.world/og-cover.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="相册">
<meta name="twitter:description" content="左右滑动翻页">
<meta name="twitter:image" content="https://muyaya.world/og-cover.png">
<style>
  /* 分享页专用：加载态与失效提示 */
  .share-error{
    position:fixed;inset:0;display:grid;place-items:center;
    padding:24px;background:radial-gradient(140% 100% at 50% -10%,
      #4a3f39 0%, #241d1a 55%, #15110f 100%);
    color:#f0eeec;text-align:center;
  }
  .share-error-box{max-width:320px}
  .share-error h1{font-size:17px;font-weight:600;margin:0 0 10px}
  .share-error p{font-size:13.5px;line-height:1.7;color:#9b9893;margin:0 0 22px}
  .share-error a{
    display:inline-block;padding:10px 22px;border-radius:9px;
    font-size:13.5px;color:#141416;background:#e8e3de;text-decoration:none;
  }
</style>
</head>
<body class="album-page share-page">

<div id="boot" class="boot"><div class="spinner"></div></div>

<!-- 阅读器内部结构由 reader.js 生成 -->
<div id="shareView" class="view read-view" hidden></div>

<div id="shareError" class="share-error" hidden>
  <div class="share-error-box">
    <h1 id="errTitle">链接无效</h1>
    <p id="errMsg">这个分享链接不存在，或者已经被撤销了。</p>
    <a href="/">回首页</a>
  </div>
</div>

<!-- ============================ 全局导航配置 ============================
     ⚠️ mode: 'brand' —— 只显示品牌位（点它回首页），不显示三个 tab。
     理由：这是**给亲友看**的只读分享页，他们没登录，
     点"相册/修图"只会被弹回登录页，那是错误的引导。
     ================================================================ -->
<script>window.AlbumNavPage = { mode: 'brand' };</script>
<script src="nav.js"></script>
<script src="orient.js"></script>
<script src="reader.js"></script>
<script src="share.js"></script>
</body>
</html>
