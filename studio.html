<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#141416">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="修图">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="studio.css">
<title>修图 · 相册工作台</title>
</head>
<body class="studio-page">

<!-- ============================ 顶栏 ============================ -->
<header class="st-bar">
  <a class="st-btn" href="/" title="回相册">‹</a>
  <span class="st-title" id="stTitle">修图</span>

  <button id="stOpen" class="st-btn wide">打开图片</button>
  <button id="stExport" class="st-btn wide primary" disabled>导出</button>

  <span class="st-sep"></span>
  <button id="stCompare" class="st-btn" title="按住看原图（或按 \ 键）" disabled>◑</button>
  <button id="stCompareToggle" class="st-btn" title="左右对比原图（分屏）" disabled>▐▌</button>
  <button id="stReset" class="st-btn" title="重置全部调整" disabled>⟲</button>
</header>

<!-- ============================ 主区 ============================ -->
<main class="st-main">

  <!-- 画布区 -->
  <section class="st-stage" id="stStage">
    <canvas id="stCanvas"></canvas>

    <!-- 没有图片时的引导 -->
    <div class="st-drop" id="stDrop">
      <div class="st-drop-icon">🖼</div>
      <h2>打开一张照片开始修</h2>
      <p>拖进来，或者点上面的「打开图片」</p>
      <p class="dim">建议用相机原图（RAW 转出的 JPG / TIFF），画质最好</p>
      <button id="stOpen2" class="st-btn primary wide">选择文件</button>
    </div>

    <!-- 美颜结果浮层。
         结果直接进画布（所见即所得），但留了一张原图备份，
         所以「撤销」随时能回到美颜前。点「就这样」表示认可，
         备份随即释放。 -->
    <div class="st-preview" id="stPreview" hidden>
      <div class="st-preview-tip" id="stPreviewTip">已美颜</div>
      <div class="st-preview-btns">
        <button id="stPreviewCancel" class="st-btn">撤销</button>
        <button id="stPreviewOk" class="st-btn primary">就这样</button>
      </div>
    </div>

    <!-- 正在处理的提示。
         去物要 16~22 秒，光一个转圈会让人以为卡死了 ——
         所以带一条真实进度条。进度按**阶段**推进（提交/重绘/取回），
         不是假的百分比动画：重绘阶段占大头，且时长不可预测，
         所以那一段显示"已等待 Ns"+ 不确定态条纹。 -->
    <div class="st-busy" id="stBusy" hidden>
      <div class="spinner"></div>
      <span id="stBusyText">处理中…</span>
      <div class="st-progress" id="stProgress" hidden>
        <div class="st-progress-bar" id="stProgressBar"></div>
      </div>
      <span class="st-progress-note" id="stProgressNote" hidden></span>
    </div>
    <!-- 左右对比滑块。
         和「按住看原图」是两件事，都保留：
           · 按住 ◑ / \ 键 = 临时看全图原图（快速确认）
           · 这个滑块     = 把画面按竖线分成左右两半，可以直接比对构图/肤色
         分割线左边显示原图、右边显示修过的。 -->
    <div class="st-compare" id="stCompareBar" hidden>
      <span class="st-compare-tag left">原图</span>
      <span class="st-compare-tag right">修图</span>
      <input type="range" id="stCompareSlider" min="0" max="100" step="0.5" value="50"
             aria-label="原图对比位置">
    </div>
  </section>

  <!-- 调整面板 -->
  <aside class="st-panel" id="stPanel">
    <div class="st-panel-head">
      <span>调整</span>
      <button id="stPanelToggle" class="st-mini" title="收起/展开">▸</button>
    </div>

    <!-- 范围：全局 / 局部（蒙版）。放在滑块上面，因为「这次调整作用于哪」
         是比「调多少」更前置的决定 -->
    <div class="st-scope" id="stScope">
      <label class="st-switch" title="打开后，下面的调整只作用于涂过的区域">
        <input type="checkbox" id="stUseMask" disabled>
        <span>只作用于涂过的区域</span>
      </label>
    </div>

    <div class="st-sliders" id="stSliders"></div>

    <!-- ===================== 蒙版工具 ===================== -->
    <div class="st-mask">
      <div class="st-mask-head">
        <button id="stBrush" class="st-btn wide" title="画笔（B）" disabled>✎ 画笔</button>
        <button id="stSeg" class="st-btn" title="AI 自动抠出人像（百度）" disabled>AI 抠人</button>
      </div>

      <div class="st-mask-row">
        <button id="stInpaint" class="st-btn wide ai" title="抹掉选区里的东西（火山即梦）" disabled>
          ✨ 抹掉选区
        </button>
      </div>

      <div class="st-mask-row" id="stBrushOpts" hidden>
        <div class="st-seg" role="group">
          <button id="stBrushAdd" class="on" title="涂上（加选区）">＋ 涂</button>
          <button id="stBrushErase" title="擦掉">－ 擦</button>
        </div>
        <button id="stMaskInvert" class="st-mini wide" title="反选">反选</button>
      </div>

      <div class="st-mask-row" id="stBrushOpts2" hidden>
        <label class="st-mini-sl">
          <span>笔刷</span>
          <input type="range" id="stRadius" min="0.01" max="0.25" step="0.005" value="0.04">
        </label>
        <label class="st-mini-sl">
          <span>硬度</span>
          <input type="range" id="stHardness" min="0" max="1" step="0.01" value="0.5">
        </label>
      </div>

      <div class="st-mask-row">
        <label class="st-switch small" title="用红色罩住选区，方便看涂在哪">
          <input type="checkbox" id="stShowMask">
          <span>显示选区</span>
        </label>
        <button id="stMaskUndo" class="st-mini" title="撤销上一笔（Cmd+Z）" disabled>↶</button>
        <button id="stMaskClear" class="st-mini" title="清空选区" disabled>✕</button>
      </div>

      <div class="st-mask-info" id="stMaskInfo">没涂任何区域</div>
    </div>

    <!-- ===================== 美颜（旷视 Face++） =====================
         单独一块，和蒙版工具分开。原因：美颜不需要蒙版，
         是「整张脸」的操作 —— 混在蒙版区里会让人以为要先涂东西。
         0.7 秒返回，所以做成"调完点一下看效果"，而不是实时的。
         刻意不做成实时：拖动滑块每动一下都发一次请求，
         免费额度并发只有 1，会一路撞限流。 -->
    <div class="st-beauty">
      <div class="st-beauty-head">
        <span>美颜</span>
        <button id="stBeautyPreset" class="st-mini wide" title="填入一组保守的婚纱照参数">一键美颜</button>
      </div>

      <!-- 一键模板：每个模板是一组调好的参数，点一下直接出图（~0.7s）。
           模板只覆盖接口支持的范围（肤质/眼/脸型/滤镜）——
           鼻子、脖子、头发、体型接口没有，那些要靠局部变形，
           详见 ai-megvii.js 里 TEMPLATES 的说明。 -->
      <div class="st-tpl" id="stTemplateRow" hidden></div>

      <div class="st-beauty-body" id="stBeautyBody">
        <div class="st-beauty-empty">需要在桌面版「修图 App」里使用</div>
      </div>
    </div>

    <!-- ===================== 裁剪 / 旋转 =====================
         本项目唯一的**几何**变换：会改变输出尺寸和坐标系。
         所以做法上刻意保守 —— 参数化（不是累积矩阵）+ 应用时烘焙。
         详细取舍见 studio.js 里「裁剪 + 旋转」那一段注释。 -->
    <div class="st-crop">
      <div class="st-crop-head">
        <button id="stCrop" class="st-btn wide" disabled>裁剪 / 旋转</button>
      </div>
      <div class="st-crop-body" id="stCropOpts" hidden>
        <label class="st-mini-sl">
          <span>旋转</span>
          <input type="range" id="stCropRot" min="-45" max="45" step="1" value="0">
        </label>
        <div class="st-crop-row">
          <span class="st-crop-val" id="stCropRotVal">0°</span>
          <button id="stCropRotL" class="st-mini wide" title="逆时针 90°">⟲ 90°</button>
          <button id="stCropRotR" class="st-mini wide" title="顺时针 90°">⟳ 90°</button>
        </div>
        <div class="st-crop-seg" id="stCropAspect" role="group"></div>
        <div class="st-crop-row">
          <button id="stCropCancel" class="st-btn wide">取消</button>
          <button id="stCropApply" class="st-btn wide primary">应用裁剪</button>
        </div>
        <div class="st-beauty-empty">
          拖动取景框移动，拖四角缩放。旋转后会自动收进不露白的范围。
        </div>
      </div>
    </div>

    <div class="st-panel-foot" id="stInfo">—</div>
  </aside>

</main>

<input type="file" id="stFile" accept="image/*" hidden>
<div id="stToast" class="toast" hidden></div>

<script src="mask.js"></script>
<script src="studio.js"></script>
</body>
</html>
